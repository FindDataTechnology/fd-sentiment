# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline / docs/IMAGE-RELEASE.md.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: fd-sentiment
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # server extras 必须装：selfcheck 会 import 上牌入口
          # `fd_sentiment.server`，而 fastmcp 属传输层 extras。
          # 测试本身不依赖 fastmcp（全部离线、假 LLM），但 selfcheck 需要。
          pip install -e ".[test,server]"

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Surface selfcheck (manifest ↔ runtime)
        run: python scripts/selfcheck_surface.py

  fd-sentiment:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-sentiment
      namespace: finddata-business

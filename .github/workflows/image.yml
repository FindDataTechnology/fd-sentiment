# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline / docs/IMAGE-RELEASE.md.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: fd-sentiment
  DOCKERFILE: Dockerfile

jobs:
  # 情绪打分测试先跑：证据纪律（evidence 必填、quote 不改写）与幂等是核心不变量，测试不过不应出片
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # server extras 必须装：selfcheck 会 import 上牌入口
          # `fd_sentiment.server`，而 fastmcp 属传输层 extras。
          # 测试本身不依赖 fastmcp（全部离线、假 LLM），但 selfcheck 需要。
          pip install -e ".[test,server]"

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Surface selfcheck (manifest ↔ runtime)
        run: python scripts/selfcheck_surface.py

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: prev
        name: 读 main 当前 digest（内容基线）
        run: |
          img="$REGISTRY/$NAMESPACE/${{ env.IMAGE_NAME }}"
          cur=$(docker buildx imagetools inspect "$img:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=$cur" >> "$GITHUB_OUTPUT"
          echo "${{ env.IMAGE_NAME }} main 当前 digest: ${cur:-<不存在，本次为首次构建>}"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          # 硬约束：开了 attestation，同内容两次构建 digest 必然不同，闸门永久失效。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 内容闸门：digest 变了才铸 sha-<commit>，让「同内容多 tag」结构上不可能。
      - name: 内容变了才铸不可变 tag
        env:
          NEW: ${{ steps.build.outputs.digest }}
          OLD: ${{ steps.prev.outputs.digest }}
        run: |
          set -euo pipefail
          img="$REGISTRY/$NAMESPACE/${{ env.IMAGE_NAME }}"
          [ -n "$NEW" ] || { echo "::error::构建未产出 digest"; exit 1; }
          if [ "$NEW" = "$OLD" ]; then
            echo "内容未变（$NEW）：不铸新 tag"
            {
              echo "### 内容未变，未产出新 tag"
              echo ""
              echo "本次构建与 \`main\` 当前指向完全一致。"
              echo ""
              echo "- 可直接 pin：\`$img@$NEW\`"
              echo "- 滚动引用：\`$img:main\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$img:$tag" "$img@$NEW"
          echo "已铸 $tag → $NEW"
          {
            echo "### 内容有变化，已铸不可变 tag"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| tag | \`$tag\` |"
            echo "| digest | \`$NEW\` |"
            echo "| 上一内容 digest | \`${OLD:-<无>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

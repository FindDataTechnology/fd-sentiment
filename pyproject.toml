[project]
name = "fd-sentiment"
version = "0.1.0"
description = "寻数·柏讯情绪打分服务：可审计、可评测、幂等可复现的文档情绪分数"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

# 传输层单列：核心打分/存储/评测只依赖标准库 + httpx（调 LLM 网关），
# 离线回归与嵌入其他进程时不必装 fastmcp。只有 MCP 入口需要它。
[project.optional-dependencies]
server = ["fastmcp>=2.0"]
test = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fd_sentiment*"]

# prompts 是带版本的工件（换版=换幂等键），必须随包分发：
# 放仓库根目录时 pip install 不会带上，从非 /app 目录运行就找不到 v2/v3。
[tool.setuptools.package-data]
fd_sentiment = ["prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
